<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="shopWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c3c"/>
      <stop offset="0.55" stop-color="#1b1d29"/>
      <stop offset="1" stop-color="#111219"/>
    </linearGradient>
    <linearGradient id="shopFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242f"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe6ff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shopVig" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="blur22" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#shopWall)"/>

  <!-- потолок -->
  <rect x="0" y="0" width="1600" height="150" fill="#15161e"/>
  <g>
    <rect x="180" y="60" width="330" height="16" rx="8" fill="url(#panel)"/>
    <rect x="620" y="46" width="330" height="16" rx="8" fill="url(#panel)"/>
    <rect x="1060" y="60" width="330" height="16" rx="8" fill="url(#panel)"/>
    <ellipse cx="345" cy="120" rx="200" ry="90" fill="url(#lampGlow)"/>
    <ellipse cx="785" cy="110" rx="200" ry="90" fill="url(#lampGlow)"/>
    <ellipse cx="1225" cy="120" rx="200" ry="90" fill="url(#lampGlow)"/>
  </g>

  <!-- вывеска -->
