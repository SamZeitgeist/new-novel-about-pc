<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <pattern id="tartan" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="120" height="120" fill="#f3d6e2"/>

      <!-- широкие серые полосы -->
      <rect x="16" y="0" width="34" height="120" fill="#918a95"/>
      <rect x="0" y="16" width="120" height="34" fill="#918a95"/>
      <rect x="24" y="0" width="18" height="120" fill="#aaa3ae"/>
      <rect x="0" y="24" width="120" height="18" fill="#aaa3ae"/>

      <!-- светлые полосы -->
      <rect x="6" y="0" width="5" height="120" fill="#fdf5f9"/>
      <rect x="0" y="6" width="120" height="5" fill="#fdf5f9"/>
      <rect x="56" y="0" width="5" height="120" fill="#fdf5f9"/>
      <rect x="0" y="56" width="120" height="5" fill="#fdf5f9"/>

      <!-- тёмкие тонкие линии -->
      <rect x="0" y="0" width="2.5" height="120" fill="#5d5761"/>
      <rect x="0" y="0" width="120" height="2.5" fill="#5d5761"/>
      <rect x="60" y="0" width="2" height="120" fill="#5d5761"/>
      <rect x="0" y="60" width="120" height="2" fill="#5d5761"/>

      <!-- тонкая светлая клетка -->
      <rect x="36" y="0" width="1.5" height="120" fill="#f1e6ec"/>
      <rect x="0" y="36" width="120" height="1.5" fill="#f1e6ec"/>
      <rect x="84" y="0" width="1.5" height="120" fill="#f1e6ec"/>
      <rect x="0" y="84" width="120" height="1.5" fill="#f1e6ec"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#tartan)"/>
</svg>
